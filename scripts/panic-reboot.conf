# Reboot instead of hanging after a kernel crash. With the default kernel.panic=0
# an oops (seen in the TCP receive path on a Wi-Fi-only server) leaves the box
# frozen until someone power-cycles it. Install with:
#   sudo cp scripts/panic-reboot.conf /etc/sysctl.d/99-panic-reboot.conf
#   sudo sysctl --system
kernel.panic_on_oops = 1
kernel.panic = 10
