# Start Docker only after the data disk (DATA_ROOT) is mounted, otherwise containers
# bind the empty folder underneath the mount point and, e.g., Postgres initialises a
# fresh empty database there. Install (adjust the unit name to your mount point:
# `systemd-escape -p --suffix=mount /srv/media` gives srv-media.mount):
#   sudo mkdir -p /etc/systemd/system/docker.service.d
#   sudo cp scripts/docker-wait-for-hdd.conf /etc/systemd/system/docker.service.d/wait-for-hdd.conf
#   sudo systemctl daemon-reload
# Wants (not Requires): if the disk fails, Docker still starts.
[Unit]
Wants=srv-media.mount
After=srv-media.mount
