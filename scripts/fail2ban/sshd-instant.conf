# Installed as /etc/fail2ban/filter.d/sshd-instant.conf (see docs/SSH-GUARD.md).
# Attempts that can never be you: a password for root (root has no password login
# and no keys) or any user that does not exist. The sshd-instant jail bans on the first.
[INCLUDES]
before = common.conf

[Definition]
_daemon = sshd
failregex = ^%(__prefix_line)sFailed (?:password|keyboard-interactive/pam) for root from <HOST> port \d+
            ^%(__prefix_line)sFailed \S+ for invalid user .*? from <HOST> port \d+
            ^%(__prefix_line)sInvalid user .*? from <HOST> port \d+
ignoreregex =
journalmatch = _COMM=sshd
