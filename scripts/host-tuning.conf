# Host tuning for a server running the VPN profiles. Install with:
#   sudo cp scripts/host-tuning.conf /etc/sysctl.d/99-meowstack.conf
#   sudo sysctl --system
#
# Why the conntrack timeout: VPN clients leak post-handshake sockets that have
# no TCP timer of their own. With the 5-day default they accumulate in the
# router's NAT table until it is full, at which point EXISTING connections keep
# working while NEW ones are silently dropped — which looks like "the server is
# down for some people" and is very hard to diagnose. Two hours clears them.
#
# This must live in /etc/sysctl.d to survive a reboot. Setting it live only
# lasts until the next restart, and the symptom comes back weeks later.
net.netfilter.nf_conntrack_tcp_timeout_established = 7200

# Required for the VPN containers to forward traffic. The compose files set
# this per-container too; this covers the host side.
net.ipv4.ip_forward = 1
