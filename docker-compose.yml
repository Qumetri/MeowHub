# meowstack — self-hosted cloud, photos, chat and downloader behind one Caddy.
#
# Everything configurable lives in .env. Nothing below should need editing to
# move this stack to a different server.
#
#   docker compose up -d          start / apply changes
#   docker compose ps             status
#   docker compose logs -f <svc>  follow one service
#
# Services with no `profiles:` key always run. The rest are opt-in through
# COMPOSE_PROFILES in .env.
name: ${STACK_NAME:-meowstack}

x-restart: &restart
  restart: unless-stopped

x-logging: &logging
  logging:
    driver: json-file
    options: { max-size: '10m', max-file: '3' }

services:
  # ---------- Reverse proxy ----------
  # Owns 80/443 and is the only public entry point. Custom image: stock Caddy
  # plus the layer4 module, so :443 can be SNI-demultiplexed between the web
  # stack and a TURN-over-TLS relay. Built by bootstrap.sh from ./caddy.
  caddy:
    container_name: ${STACK_NAME:-meowstack}_caddy
    build: ./caddy
    image: caddy-l4:local
    <<: [*restart, *logging]
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    volumes:
      - ./caddy/Caddyfile.l4:/etc/caddy/Caddyfile:ro
      - ./caddy/data:/data
      - ./caddy/config:/config
      - ./dashboard/dist:/srv/dashboard:ro
    environment:
      BASE_DOMAIN: ${BASE_DOMAIN}
      CLOUD_HOST: ${CLOUD_HOST}
      PHOTOS_HOST: ${PHOTOS_HOST}
      MATRIX_HOST: ${MATRIX_HOST:-matrix.${BASE_DOMAIN}}
      TURN_HOST: ${TURN_HOST}
      ACME_EMAIL: ${ACME_EMAIL}
      CADDY_INTERNAL_HTTPS: ${CADDY_INTERNAL_HTTPS:-9443}
      DASHBOARD_PATH: ${DASHBOARD_PATH}
      MATRIXRTC_PATH: ${MATRIXRTC_PATH}
      METUBE_PATH: ${METUBE_PATH}
      AWG_ADMIN_PATH: ${AWG_ADMIN_PATH}
      AWG_ADMIN_USER: ${AWG_ADMIN_USER:-awgadmin}
      # These three are read by Caddy from its OWN env. An empty value turns
      # handle_path /{$VAR}/* into /*, which would swallow the entire root
      # domain, so each carries a non-empty fallback rather than defaulting
      # to the empty string.
      CRYPTO_PATH: ${CRYPTO_PATH:-crypto-unset}
      CRYPTO_ADMIN_USER: ${CRYPTO_ADMIN_USER:-cryptoadmin}
      N8N_PUBLIC_PATH: ${N8N_PUBLIC_PATH:-n8n-unset}
      SENSOR_PATH: ${SENSOR_PATH:-sensor-unset}
      # Helper bot Mini App + owner admin page. These carry `:?` (fail the whole
      # `docker compose` command) rather than a fallback, for the same reason:
      # an empty path turns the route into /* and swallows the root domain.
      # bootstrap.sh generates all three; run it after pulling this change.
      BOT_APP_PATH: ${BOT_APP_PATH:?BOT_APP_PATH must be set and non-empty (run ./bootstrap.sh)}
      BOT_ADMIN_PATH: ${BOT_ADMIN_PATH:?BOT_ADMIN_PATH must be set and non-empty (run ./bootstrap.sh)}
      BOT_ADMIN_KEY: ${BOT_ADMIN_KEY:?BOT_ADMIN_KEY must be set and non-empty (run ./bootstrap.sh)}
      BOT_ADMIN_USER: ${BOT_ADMIN_USER:-botadmin}
      XUI_SUB_PORT: ${XUI_SUB_PORT:-2096}
    # Reaches host-network services (the 3x-ui VPN inbounds) from inside the
    # container. Without this the layer4 passthrough routes cannot resolve.
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    networks: [default, proxy]

  # ---------- Hub page backend ----------
  # Live host metrics for the dashboard. Reads the HOST, not the container:
  # /proc/1/net/dev is the host root netns, /host/root is the real filesystem.
  # ---------- Crypto tracker ----------
  # Live Binance prices, price-target and volatility alerts to Telegram, and a
  # web UI on a secret path. Dependency-free Python (stdlib websocket client,
  # HTTP server and Telegram sender), so nothing is pulled at build time for a
  # path that alerts on money.
  crypto:
    container_name: ${STACK_NAME:-meowstack}_crypto
    build: ./crypto
    image: ${CRYPTO_IMAGE:-meowhub-crypto:1.0}
    profiles: [crypto]
    <<: [*restart, *logging]
    ports:
      - '${BIND_LOCAL:-127.0.0.1}:${CRYPTO_LOCAL_PORT:-8084}:9102'
    environment:
      TZ: ${TZ:-UTC}
      CRYPTO_DB: /data/crypto.db
      LOG_LEVEL: ${CRYPTO_LOG_LEVEL:-INFO}
      # Ask n8n to explain each volatility alert (docs/CRYPTO.md). Empty = off.
      CRYPTO_EXPLAIN_HOOK: ${CRYPTO_EXPLAIN_HOOK:-}
      CRYPTO_EXPLAIN_SECRET: ${CRYPTO_EXPLAIN_SECRET:-}
      # Telegram delivery. Set in .env, these override (and lock) the UI fields.
      CRYPTO_TG_TOKEN: ${CRYPTO_TG_TOKEN:-}
      CRYPTO_TG_CHAT_ID: ${CRYPTO_TG_CHAT_ID:-}
    volumes:
      - ./crypto/data:/data

  # ---------- ESP32 sensor dashboard ----------
  # Temperature/humidity charts for an ESP32 + DHT-22 that posts over HTTPS
  # through Caddy (SENSOR_PATH) with the X-Sensor-Token header. The app lives in
  # its own repo and is built straight from GitHub at a pinned commit; bump the
  # hash (and the image tag) to upgrade. See docs/SENSOR.md.
  sensor:
    container_name: ${STACK_NAME:-meowstack}_sensor
    build: ${SENSOR_BUILD:-https://github.com/Qumetri/esp32-sensor-dashboard.git#da6c7b97c10e093233630afc2192ff4bc25c1121}
    image: ${SENSOR_IMAGE:-meowhub-sensor:da6c7b9}
    profiles: [sensor]
    <<: [*restart, *logging]
    ports:
      - '${BIND_LOCAL:-127.0.0.1}:${SENSOR_LOCAL_PORT:-8085}:3001'
    environment:
      TZ: ${TZ:-UTC}
      # Generated by bootstrap.sh. Empty would let anyone on the internet post.
      SENSOR_TOKEN: ${SENSOR_TOKEN:-}
    volumes:
      - ./sensor/data:/app/WebServer/data


  # ---------- Helper bot ----------
  # Read-only window onto the Docker API for the bot's health checks. Only
  # GET /containers is allowed -- the raw socket would be root on the host,
  # and the bot talks to the internet. Internal-only network, nothing else on it.
  docker-proxy:
    container_name: ${STACK_NAME:-meowstack}_docker_proxy
    image: ${DOCKER_PROXY_IMAGE:-tecnativa/docker-socket-proxy:v0.5.0}
    profiles: [helper]
    <<: [*restart, *logging]
    environment:
      CONTAINERS: '1'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [helper-docker]

  # Telegram bot: server health + alerts, hub links, downloads via MeTube and,
  # for the owner only, the hub's logins -- plus the membership system (access
  # codes, VPN + Matrix accounts for members) with its Mini App and admin page.
  # The bot itself long-polls; the Mini App server (:8095) is reached only
  # through Caddy. Setup: docs/HELPER.md.
  helper:
    container_name: ${STACK_NAME:-meowstack}_helper
    build: ./helper
    image: ${HELPER_IMAGE:-meowstack-helper:local}
    profiles: [helper]
    <<: [*restart, *logging]
    environment:
      TZ: ${TZ:-UTC}
      HELPER_BOT_TOKEN: ${HELPER_BOT_TOKEN:-}
      # Optional second bot for members; the owner keeps this one for ops (docs/HELPER.md
      # "Two bots"). Empty -> single-bot mode; can also be pasted on the Bots page.
      MEMBER_BOT_TOKEN: ${MEMBER_BOT_TOKEN:-}
      HELPER_OWNER_ID: ${HELPER_OWNER_ID:-}
      HELPER_REPORT_HOUR: ${HELPER_REPORT_HOUR:-9}
      BASE_DOMAIN: ${BASE_DOMAIN}
      DASHBOARD_PATH: ${DASHBOARD_PATH}
      METUBE_PATH: ${METUBE_PATH:-}
      METUBE_TTL_MIN: ${METUBE_TTL_MIN:-720}
      # Logins the owner can ask the bot for. Accounts that only keep a hash
      # (3x-ui, Immich, n8n) are added from Telegram with /setpass.
      VAULT_NEXTCLOUD_USER: ${NEXTCLOUD_ADMIN_USER:-admin}
      VAULT_NEXTCLOUD_PASS: ${NEXTCLOUD_ADMIN_PASSWORD:-}
      VAULT_NEXTCLOUD_NOTE: initial password from .env
      VAULT_CRYPTO_USER: ${CRYPTO_ADMIN_USER:-cryptoadmin}
      VAULT_CRYPTO_PASS_FILE: /secrets/crypto-admin-password
      VAULT_AMNEZIAWG_USER: ${AWG_ADMIN_USER:-awgadmin}
      VAULT_AMNEZIAWG_PASS_FILE: /secrets/awg-admin-password
      VAULT_BOTS_USER: ${BOT_ADMIN_USER:-botadmin}
      VAULT_BOTS_PASS_FILE: /secrets/bot-admin-password
      # ---- memberships (docs/HELPER.md "Members") ----
      # Telegram @handle shown to strangers and members ("contact the owner").
      # Empty -> the bot just says "contact the owner".
      OWNER_CONTACT: ${OWNER_CONTACT:-}
      BOT_APP_PATH: ${BOT_APP_PATH:?BOT_APP_PATH must be set and non-empty (run ./bootstrap.sh)}
      BOT_ADMIN_KEY: ${BOT_ADMIN_KEY:?BOT_ADMIN_KEY must be set and non-empty (run ./bootstrap.sh)}
      WEBAPP_DIR: /webapp
      # 3x-ui panel API (host network). Empty token -> VPN features show "not
      # configured" and everything else keeps working.
      XUI_URL: ${XUI_URL:-https://host.docker.internal:${XUI_PANEL_PORT:-10358}/${XUI_PANEL_PATH:-}}
      XUI_API_TOKEN: ${XUI_API_TOKEN:-}
      # Members' subscription links. The :443 /sub/ route in Caddy is the default
      # because networks that block high ports can't reach :2096.
      VPN_SUB_BASE: ${VPN_SUB_BASE:-https://${BASE_DOMAIN}/sub/}
      # Synapse admin API, for members' Matrix accounts (locked on expiry).
      # Empty admin user/password -> Matrix features show "not configured".
      MATRIX_URL: http://matrix-synapse:8008
      MATRIX_HOST: ${MATRIX_HOST:-matrix.${BASE_DOMAIN}}
      MATRIX_SERVER_NAME: ${MATRIX_SERVER_NAME:-${BASE_DOMAIN}}
      MATRIX_ADMIN_USER: ${MATRIX_ADMIN_USER:-}
      MATRIX_ADMIN_PASSWORD: ${MATRIX_ADMIN_PASSWORD:-}
      MATRIX_MAX_PER_MEMBER: ${MATRIX_MAX_PER_MEMBER:-2}
      # The crypto tracker's bot, shown on the admin "Bots" page (getMe only).
      CRYPTO_TG_TOKEN: ${CRYPTO_TG_TOKEN:-}
      # Where the Bots page pushes a new crypto-bot token (the tracker's settings API).
      CRYPTO_URL: ${CRYPTO_URL:-http://crypto:9102/api/settings}
    volumes:
      - ./helper/data:/data
      - ./dashboard/dist:/hub:ro
      - ./helper/webapp/dist:/webapp:ro
      - ./secrets:/secrets:ro
      - /proc:/host/proc:ro
      - ${METUBE_DOWNLOADS}:/downloads:ro
    # Mini App / admin API, loopback only for local debugging.
    ports:
      - '${BIND_LOCAL:-127.0.0.1}:${HELPER_LOCAL_PORT:-8086}:8095'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    networks: [default, helper-docker]

  hub-stats:
    container_name: ${STACK_NAME:-meowstack}_hub_stats
    image: ${STATS_IMAGE:-python:3.12-slim}
    <<: [*restart, *logging]
    command: python /app/server.py
    volumes:
      - ./stats/server.py:/app/server.py:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro
      - ${DATA_ROOT}:/host/media:ro

  # ---------- Nextcloud ----------
  nextcloud:
    container_name: ${STACK_NAME:-meowstack}_nextcloud
    image: ${NEXTCLOUD_IMAGE:-nextcloud:34-apache}
    profiles: [nextcloud]
    <<: [*restart, *logging]
    depends_on: [nextcloud-db, nextcloud-redis]
    ports:
      - '${BIND_LOCAL:-127.0.0.1}:${NEXTCLOUD_LOCAL_PORT:-8081}:80'
    volumes:
      - ./nextcloud/html:/var/www/html
      - ${NEXTCLOUD_DATA}:/var/www/html/data
      - ${PLEX_MEDIA:-/srv/media/plex}:/mnt/plex   # shown in Nextcloud as the folder "Plex" (scripts/plex-library.sh)
    environment:
      MYSQL_HOST: nextcloud-db
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD: ${NEXTCLOUD_DB_PASSWORD}
      REDIS_HOST: nextcloud-redis
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER:-admin}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD}
      NEXTCLOUD_TRUSTED_DOMAINS: ${CLOUD_HOST}
      # These four are what make redirects and generated URLs correct behind a
      # reverse proxy. Removing any of them breaks logins and share links.
      OVERWRITEPROTOCOL: https
      OVERWRITEHOST: ${CLOUD_HOST}
      OVERWRITECLIURL: https://${CLOUD_HOST}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.16.0.0/12}
      PHP_UPLOAD_LIMIT: ${NEXTCLOUD_UPLOAD_LIMIT:-16G}
      PHP_MEMORY_LIMIT: ${NEXTCLOUD_MEMORY_LIMIT:-1G}
      TZ: ${TZ}

  nextcloud-cron:
    container_name: ${STACK_NAME:-meowstack}_nextcloud_cron
    image: ${NEXTCLOUD_IMAGE:-nextcloud:34-apache}
    profiles: [nextcloud]
    <<: [*restart, *logging]
    entrypoint: /cron.sh
    depends_on: [nextcloud-db, nextcloud-redis]
    volumes:
      - ./nextcloud/html:/var/www/html
      - ${NEXTCLOUD_DATA}:/var/www/html/data
      - ${PLEX_MEDIA:-/srv/media/plex}:/mnt/plex   # shown in Nextcloud as the folder "Plex" (scripts/plex-library.sh)

  nextcloud-db:
    container_name: ${STACK_NAME:-meowstack}_nextcloud_db
    image: ${NEXTCLOUD_DB_IMAGE:-mariadb:11.4}
    profiles: [nextcloud]
    <<: [*restart, *logging]
    command: --transaction-isolation=READ-COMMITTED --binlog-format=ROW
    volumes:
      - ./nextcloud/db:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${NEXTCLOUD_DB_ROOT_PASSWORD}
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD: ${NEXTCLOUD_DB_PASSWORD}
      MARIADB_AUTO_UPGRADE: '1'

  nextcloud-redis:
    container_name: ${STACK_NAME:-meowstack}_nextcloud_redis
    image: ${NEXTCLOUD_REDIS_IMAGE:-redis:7-alpine}
    profiles: [nextcloud]
    <<: [*restart, *logging]

  # ---------- Immich ----------
  immich-server:
    container_name: ${STACK_NAME:-meowstack}_immich_server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-v3}
    profiles: [immich]
    <<: [*restart, *logging]
    depends_on: [immich-redis, immich-db]
    ports:
      - '${BIND_LOCAL:-127.0.0.1}:${IMMICH_LOCAL_PORT:-2283}:2283'
    volumes:
      - ${IMMICH_UPLOAD}:/data
      - /etc/localtime:/etc/localtime:ro
      - ${PHOTOS_EXTERNAL}:/mnt/media/Photos:ro
    env_file: [.env]
    environment:
      DB_HOSTNAME: immich-db
      REDIS_HOSTNAME: immich-redis
    healthcheck:
      disable: false

  immich-machine-learning:
    container_name: ${STACK_NAME:-meowstack}_immich_ml
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-v3}
    profiles: [immich]
    <<: [*restart, *logging]
    volumes:
      - ./immich/model-cache:/cache
    env_file: [.env]
    healthcheck:
      disable: false

  immich-redis:
    container_name: ${STACK_NAME:-meowstack}_immich_redis
    image: ${IMMICH_REDIS_IMAGE:-docker.io/valkey/valkey:9}
    profiles: [immich]
    <<: [*restart, *logging]
    healthcheck:
      test: redis-cli ping || exit 1

  immich-db:
    container_name: ${STACK_NAME:-meowstack}_immich_db
    image: ${IMMICH_DB_IMAGE}
    profiles: [immich]
    <<: [*restart, *logging]
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      - ${IMMICH_DB_DATA}:/var/lib/postgresql/data
    shm_size: 128mb
    healthcheck:
      disable: false

  # ---------- Matrix ----------
  # Runs as uid 1000 so ./matrix/synapse stays editable from the host.
  matrix-synapse:
    container_name: ${STACK_NAME:-meowstack}_synapse
    image: ${SYNAPSE_IMAGE:-ghcr.io/element-hq/synapse:latest}
    profiles: [matrix]
    <<: [*restart, *logging]
    user: '${PUID:-1000}:${PGID:-1000}'
    depends_on: [matrix-db]
    ports:
      - '${BIND_LOCAL:-127.0.0.1}:${SYNAPSE_LOCAL_PORT:-8008}:8008'
    volumes:
      - ./matrix/synapse:/data
      - ${MATRIX_MEDIA}:/media

  matrix-db:
    container_name: ${STACK_NAME:-meowstack}_matrix_db
    image: ${MATRIX_DB_IMAGE:-postgres:16-alpine}
    profiles: [matrix]
    <<: [*restart, *logging]
    environment:
      POSTGRES_USER: synapse
      POSTGRES_PASSWORD: ${MATRIX_DB_PASSWORD}
      POSTGRES_DB: synapse
      # Synapse requires the C locale for its collation. Changing this after
      # first init means recreating the database.
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    volumes:
      - ${MATRIX_DB_DATA}:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U synapse']
      interval: 10s
      timeout: 5s
      retries: 5

  matrix-element:
    container_name: ${STACK_NAME:-meowstack}_element
    image: ${ELEMENT_IMAGE:-vectorim/element-web:latest}
    profiles: [matrix]
    <<: [*restart, *logging]
    ports:
      - '${BIND_LOCAL:-127.0.0.1}:${ELEMENT_LOCAL_PORT:-8082}:80'
    volumes:
      - ./matrix/element/config.json:/app/config.json:ro

  # Legacy 1:1 calls only (Element Web old calls, FluffyChat). Element X uses
  # LiveKit below instead. Host networking because TURN needs the real relay range.
  matrix-coturn:
    container_name: ${STACK_NAME:-meowstack}_coturn
    image: ${COTURN_IMAGE:-coturn/coturn:latest}
    profiles: [matrix]
    <<: [*restart, *logging]
    network_mode: host
    volumes:
      - ./matrix/coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro

  # MatrixRTC / Element Call. Media ports MUST be published — LiveKit's embedded
  # TURN relays to its own media port, so unpublishing them breaks TURN too.
  matrix-livekit:
    container_name: ${STACK_NAME:-meowstack}_livekit
    image: ${LIVEKIT_IMAGE:-livekit/livekit-server:v1.8}
    profiles: [matrix]
    <<: [*restart, *logging]
    command: --config /etc/livekit.yaml
    ports:
      - '${LIVEKIT_TCP_PORT:-7881}:7881'
      - '${LIVEKIT_UDP_PORT:-7882}:7882/udp'
    volumes:
      - ./matrix/livekit/livekit.yaml:/etc/livekit.yaml:ro

  matrix-livekit-jwt:
    container_name: ${STACK_NAME:-meowstack}_livekit_jwt
    image: ${LIVEKIT_JWT_IMAGE:-ghcr.io/element-hq/lk-jwt-service:latest}
    profiles: [matrix]
    <<: [*restart, *logging]
    depends_on: [matrix-livekit]
    environment:
      LK_JWT_PORT: '8080'
      LIVEKIT_URL: wss://${MATRIX_HOST}/${MATRIXRTC_PATH}/sfu
      LIVEKIT_KEY: ${LIVEKIT_KEY}
      LIVEKIT_SECRET: ${LIVEKIT_SECRET}
      LIVEKIT_FULL_ACCESS_HOMESERVERS: ${BASE_DOMAIN}

  # ---------- MeTube ----------
  # URL_PREFIX must match the Caddy path. Caddy uses `handle` (not handle_path)
  # so the prefix survives — MeTube builds its asset URLs under it.
  metube:
    container_name: ${STACK_NAME:-meowstack}_metube
    image: ${METUBE_IMAGE:-ghcr.io/alexta69/metube:latest}
    profiles: [metube]
    <<: [*restart, *logging]
    ports:
      - '${BIND_LOCAL:-127.0.0.1}:${METUBE_LOCAL_PORT:-8083}:8081'
    environment:
      URL_PREFIX: /${METUBE_PATH}/
      DEFAULT_THEME: dark
      DOWNLOAD_DIR: /downloads
      PUID: '${PUID:-1000}'
      PGID: '${PGID:-1000}'
      # Ephemeral by default: finished downloads are tap-to-save links, the
      # trash button deletes the real file, and the janitor purges the root.
      # Files put in keep/ (via CUSTOM_DIRS) are never purged.
      DOWNLOAD_DIRS_INDEXABLE: 'true'
      DELETE_FILE_ON_TRASHCAN: 'true'
      CUSTOM_DIRS: 'true'
      CREATE_CUSTOM_DIRS: 'true'
    volumes:
      - ${METUBE_DOWNLOADS}:/downloads

  # -maxdepth 1 keeps keep/ and .metube state untouched. In-progress files stay
  # because their mtime keeps refreshing.
  metube-janitor:
    container_name: ${STACK_NAME:-meowstack}_metube_janitor
    image: alpine:3
    profiles: [metube]
    <<: [*restart, *logging]
    environment:
      METUBE_TTL_MIN: '${METUBE_TTL_MIN:-720}'
    command: >
      sh -c 'while true; do
        find /downloads -maxdepth 1 -type f -mmin +"$${METUBE_TTL_MIN}" -delete 2>/dev/null || true;
        sleep 1800;
      done'
    volumes:
      - ${METUBE_DOWNLOADS}:/downloads

  # ---------- n8n automation ----------
  # Workflow automation: schedule/webhook -> HTTP -> LLM -> notification.
  # Served on a secret path. Auth is n8n's OWN account login (with optional
  # 2FA), not basic_auth -- a second credential prompt is what breaks the
  # editor's websocket push channel.
  n8n:
    container_name: ${STACK_NAME:-meowstack}_n8n
    image: ${N8N_IMAGE:-n8nio/n8n:2.41.2}
    profiles: [n8n]
    <<: [*restart, *logging]
    ports:
      - '${BIND_LOCAL:-127.0.0.1}:${N8N_LOCAL_PORT:-5678}:5678'
    environment:
      TZ: ${TZ:-UTC}
      GENERIC_TIMEZONE: ${TZ:-UTC}
      # Encrypts every credential stored in n8n's database. Back it up with
      # .env: change or lose it and every saved credential becomes unreadable.
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_HOST: ${BASE_DOMAIN}
      N8N_PROTOCOL: https
      N8N_PORT: 5678
      # N8N_PATH only changes the URLs n8n GENERATES; it still serves its files
      # from the root. That is why Caddy strips the prefix with handle_path --
      # the two settings are complements, not duplicates. See docs/N8N.md.
      N8N_PATH: /${N8N_PUBLIC_PATH}/
      N8N_EDITOR_BASE_URL: https://${BASE_DOMAIN}/${N8N_PUBLIC_PATH}/
      WEBHOOK_URL: https://${BASE_DOMAIN}/${N8N_PUBLIC_PATH}/
      N8N_PROXY_HOPS: 1
      N8N_RUNNERS_ENABLED: 'true'
      # No telemetry, no upsell banners, and Code nodes cannot read the
      # container's environment (where the encryption key lives).
      N8N_DIAGNOSTICS_ENABLED: 'false'
      N8N_VERSION_NOTIFICATIONS_ENABLED: 'false'
      N8N_HIRING_BANNER_ENABLED: 'false'
      N8N_BLOCK_ENV_ACCESS_IN_NODE: 'true'
    volumes:
      - ./n8n/data:/home/node/.n8n

  # ---------- Ollama ----------
  # Local LLM runtime for n8n. Deliberately publishes NO port: n8n reaches it
  # as http://ollama:11434 over the compose network. This is an unauthenticated
  # API -- publishing it hands a model server to anything that can reach the
  # host. GPU is opt-in through docker-compose.gpu.yml; without it this runs on
  # the CPU, which is slow but works.
  ollama:
    container_name: ${STACK_NAME:-meowstack}_ollama
    image: ${OLLAMA_IMAGE:-ollama/ollama:0.20.3}
    profiles: [ollama]
    <<: [*restart, *logging]
    environment:
      TZ: ${TZ:-UTC}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-5m}
    volumes:
      # Models are bulky and belong on the data disk, not the system disk.
      - ${OLLAMA_MODELS}:/root/.ollama

networks:
  default:
  # Shared with the AmneziaWG project so Caddy can resolve its web UI by name.
  # Created by bootstrap.sh; external so neither project owns (or deletes) it.
  proxy:
    external: true
    name: ${PROXY_NETWORK:-meowstack-proxy}
  # docker-proxy <-> helper only; internal: no route to the outside.
  helper-docker:
    internal: true
